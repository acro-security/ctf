<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF Challenge Search</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1c2024;
      --muted: #667085;
      --border: #d8dde3;
      --accent: #2f6feb;
      --accent-soft: #e8f0ff;
      --chip: #eef1f5;
      --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e6e8ec;
        --muted: #9aa4b2;
        --border: #2a2f3a;
        --accent: #7aa2ff;
        --accent-soft: #1b2a4a;
        --chip: #222733;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 64px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) 150px 150px 150px;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 14px 0 4px;
    }

    .tag {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      background: var(--chip);
      color: var(--text);
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
    }

    .tag[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .tag .count {
      margin-left: 4px;
      opacity: .65;
      font-size: .78em;
    }

    .status {
      margin: 16px 0;
      color: var(--muted);
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.08rem;
    }

    .badge {
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid transparent;
      background: var(--chip);
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* Category colours. Unknown categories fall back to the neutral chip. */

    .badge[data-category="crypto"] {
      background: #efe7ff;
      color: #6b3fc4;
      border-color: #d8c7fb;
    }

    .badge[data-category="exploit"] {
      background: #ffe8ea;
      color: #b42318;
      border-color: #f8c4c9;
    }

    .badge[data-category="web"] {
      background: #e6f6f4;
      color: #0f766e;
      border-color: #b8e5df;
    }

    .badge[data-category="rev"] {
      background: #fff1e3;
      color: #a8540a;
      border-color: #f7d6b3;
    }

    .badge[data-category="pwn"] {
      background: #ffe9f2;
      color: #a3145c;
      border-color: #f8c2d8;
    }

    .badge[data-category="forensics"] {
      background: #e9f1ff;
      color: #1b4fa8;
      border-color: #c5d9f8;
    }

    .badge[data-category="stego"] {
      background: #f0eaff;
      color: #5b34b0;
      border-color: #d9ccfa;
    }

    .badge[data-category="osint"] {
      background: #e8f7e8;
      color: #256b28;
      border-color: #c2e6c3;
    }

    .badge[data-category="misc"] {
      background: #eef1f5;
      color: #4a5563;
      border-color: #d8dde3;
    }

    .badge[data-category="blockchain"] {
      background: #fff7db;
      color: #8a6400;
      border-color: #f3e2a3;
    }

    .badge[data-category="game-hacking"] {
      background: #eae4ff;
      color: #4d32a8;
      border-color: #d3c8fb;
    }

    @media (prefers-color-scheme: dark) {
      .badge[data-category="crypto"] {
        background: #241a3d;
        color: #c4a8ff;
        border-color: #3b2b62;
      }

      .badge[data-category="exploit"] {
        background: #3a1519;
        color: #ff8f98;
        border-color: #5c1f26;
      }

      .badge[data-category="web"] {
        background: #10302e;
        color: #7fd8cd;
        border-color: #1b4d49;
      }

      .badge[data-category="rev"] {
        background: #3a2411;
        color: #f6bc7c;
        border-color: #5a3a19;
      }

      .badge[data-category="pwn"] {
        background: #3a1226;
        color: #ff96c0;
        border-color: #5c1d3d;
      }

      .badge[data-category="forensics"] {
        background: #11213d;
        color: #94b8f5;
        border-color: #1d3460;
      }

      .badge[data-category="stego"] {
        background: #241a3d;
        color: #bfa6ff;
        border-color: #3a2a61;
      }

      .badge[data-category="osint"] {
        background: #12311a;
        color: #8ee096;
        border-color: #1e4f2a;
      }

      .badge[data-category="misc"] {
        background: #222733;
        color: #9aa4b2;
        border-color: #2f3542;
      }

      .badge[data-category="blockchain"] {
        background: #322711;
        color: #f3c969;
        border-color: #55430f;
      }

      .badge[data-category="game-hacking"] {
        background: #221b3d;
        color: #b9a6ff;
        border-color: #372c60;
      }
    }

    .difficulty {
      border-radius: 999px;
      padding: 2px 8px;
      font-size: .75rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .difficulty[data-level="trivial"] {
      background: #e7f6ec;
      color: #1a7f37;
      border-color: #b7e4c7;
    }

    .difficulty[data-level="easy"] {
      background: #e8f3ff;
      color: #1b6ec2;
      border-color: #bfdcfb;
    }

    .difficulty[data-level="moderate"] {
      background: #fff6e0;
      color: #9a6700;
      border-color: #f2dfae;
    }

    .difficulty[data-level="hard"] {
      background: #ffece5;
      color: #c2410c;
      border-color: #f9c9b4;
    }

    .difficulty[data-level="brutal"] {
      background: #ffe8ea;
      color: #b42318;
      border-color: #f8c4c9;
    }

    @media (prefers-color-scheme: dark) {
      .difficulty[data-level="trivial"] {
        background: #10331c;
        color: #7ee2a8;
        border-color: #1d5433;
      }

      .difficulty[data-level="easy"] {
        background: #10253d;
        color: #8ab4f8;
        border-color: #1d3d63;
      }

      .difficulty[data-level="moderate"] {
        background: #322711;
        color: #f3c969;
        border-color: #55430f;
      }

      .difficulty[data-level="hard"] {
        background: #3a1d12;
        color: #ffa981;
        border-color: #5b2b18;
      }

      .difficulty[data-level="brutal"] {
        background: #3a1519;
        color: #ff8f98;
        border-color: #5c1f26;
      }
    }

    .meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .summary {
      margin: 10px 0;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 10px 0;
    }

    .card-tags span {
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--chip);
      color: var(--muted);
      font-size: .78rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin: 0;
      font-size: .88rem;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }

    .links code {
      color: var(--muted);
      font-size: .8rem;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 32px 0;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      header, main { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>CTF Challenge Search</h1>
    <p class="subtitle">Local index of this repository. Filter by category, tag, difficulty, or free text.</p>
  </header>

  <main>
    <section class="controls" aria-label="Filters">
      <input id="q" type="search" placeholder="Search title, tag, path, summary..." autocomplete="off">
      <select id="category" aria-label="Category">
        <option value="">All categories</option>
      </select>
      <select id="difficulty" aria-label="Difficulty">
        <option value="">All difficulties</option>
      </select>
      <select id="mode" aria-label="Tag matching">
        <option value="all">Match all tags</option>
        <option value="any">Match any tag</option>
      </select>
    </section>

    <section id="tags" class="tags" aria-label="Tags"></section>
    <p id="status" class="status">Loading...</p>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
